<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Customer Login - ShopSense</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-container">

    <h1>ShopSense</h1>
    <h3>Customer Login</h3>

    <input
        type="email"
        id="email"
        placeholder="Customer Email">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button onclick="customerLogin()">
        Login
    </button>

    <p id="message"></p>

</div>

<script src="js/customer-login.js"></script>

</body>
</html>
