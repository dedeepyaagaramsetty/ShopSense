<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <title>ShopSense</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<h1>🛒 ShopSense</h1>

<div class="navbar">

    <button>🏠 Home</button>

    <button onclick="window.location.href='customer-orders.html'">
        📦 My Orders
    </button>

    <button onclick="window.location.href='customer-wishlist.html'">
        ❤️ Wishlist
    </button>

    <button onclick="window.location.href='customer-profile.html'">
        👤 Profile
    </button>
    <button onclick="logout()">
        🚪 Logout
    </button>

</div>
<hr>

<div class="card">

    <input
        type="text"
        id="searchBox"
        placeholder="🔍 Search Products..."
        onkeyup="filterProducts()">

    <br><br>

    <label><b>Category:</b></label>

    <select id="categoryFilter" onchange="filterProducts()">

        <option value="All">All</option>
        <option value="Electronics">Electronics</option>
        <option value="Mobiles">Mobiles</option>
        <option value="Laptops">Laptops</option>
        <option value="Fashion">Fashion</option>
        <option value="Grocery">Grocery</option>

    </select>

    &nbsp;&nbsp;&nbsp;

    <label><b>Sort By:</b></label>

    <select id="sortFilter" onchange="filterProducts()">

        <option value="default">Default</option>
        <option value="low">Price: Low → High</option>
        <option value="high">Price: High → Low</option>

    </select>

</div>

<br>
<br>

<div class="card">

    <h2>
        Welcome,
        <span id="customerName">
            Loading...
        </span>
        👋
    </h2>

    <p>Email :
        <span id="customerEmail"></span>
    </p>

    <p>Total Orders :
        <span id="totalOrders"></span>
    </p>

</div>
<br>

<div class="card">

    <h2>⭐ Recommended For You</h2>

    <div id="recommendationContainer">

    </div>

</div>

<br>
<br>



<div id="productsContainer">

</div>

<script src="js/customer-dashboard.js"></script>

</body>

</html>
