<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Vendor Registration - ShopSense</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-container">

    <h1>ShopSense</h1>
    <h3>Vendor Registration</h3>

    <input type="text" id="owner_name" placeholder="Owner Name">

    <input type="text" id="business_name" placeholder="Business Name">

    <input type="email" id="email" placeholder="Email">

    <input type="text" id="phone" placeholder="Phone Number">

    <input type="password" id="password" placeholder="Password">

    <button onclick="registerVendor()">
        Register
    </button>

    <p id="message"></p>

    <br><br>

    <a href="vendor-login.html">
        Already have an account? Login
    </a>

</div>

<script src="js/vendor-register.js"></script>

</body>
</html>
