<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Customer Registration - ShopSense</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-container">

    <h1>ShopSense</h1>
    <h3>Customer Registration</h3>

    <input
        type="text"
        id="full_name"
        placeholder="Full Name">

    <input
        type="email"
        id="email"
        placeholder="Email">

    <input
        type="text"
        id="phone"
        placeholder="Phone Number">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <input
        type="text"
        id="address"
        placeholder="Address">

    <button onclick="registerCustomer()">
        Register
    </button>

    <p id="message"></p>

    <br><br>

    <a href="customer-login.html">
        Already have an account? Login
    </a>

</div>

<script src="js/customer-register.js"></script>

</body>

</html>
