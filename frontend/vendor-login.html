<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Vendor Login - ShopSense</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-container">

    <h1>ShopSense</h1>
    <h3>Vendor Login</h3>

    <input
        type="email"
        id="email"
        placeholder="Vendor Email">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button onclick="vendorLogin()">
        Login
    </button>
    <br><br>

    <a href="vendor-register.html">
        New Vendor? Register Here
    </a>

    <p id="message"></p>

</div>

<script src="js/vendor-login.js"></script>

</body>
</html>
