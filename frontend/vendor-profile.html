<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>ShopSense - Vendor Profile</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<h1>🛒 ShopSense</h1>

<div class="sidebar">

    <h2>🏪 Vendor</h2>

    <a href="vendor-dashboard.html">
        🏠 Dashboard
    </a>

    <a href="vendor-products.html">
        📦 My Products
    </a>

    <a href="vendor-transactions.html">
        💰 Transactions
    </a>

    <a class="active" href="vendor-profile.html">
        👤 Profile
    </a>

    <a href="settings.html">
        ⚙ Settings
    </a>

    <a href="#" onclick="logout()">
        🚪 Logout
    </a>

</div>


<div class="main-content">

    <div class="card">

        <h2>👤 Vendor Profile</h2>

        <div id="message"></div>

        <!-- VIEW MODE -->

        <div id="profileView">

            <p>
                <b>Owner Name:</b>
                <span id="ownerName">Loading...</span>
            </p>

            <p>
                <b>Business Name:</b>
                <span id="businessName">Loading...</span>
            </p>

            <p>
                <b>Email:</b>
                <span id="email">Loading...</span>
            </p>

            <p>
                <b>Phone:</b>
                <span id="phone">Loading...</span>
            </p>

            <p>
                <b>Status:</b>
                <span id="status">Loading...</span>
            </p>

            <br>

            <button onclick="enableEdit()">
                ✏️ Edit Profile
            </button>

        </div>


        <!-- EDIT MODE -->

        <div id="profileEdit" style="display:none;">

            <label>
                <b>Owner Name</b>
            </label>

            <input
                type="text"
                id="editOwnerName"
                placeholder="Enter owner name"
            >

            <br><br>


            <label>
                <b>Business Name</b>
            </label>

            <input
                type="text"
                id="editBusinessName"
                placeholder="Enter business name"
            >

            <br><br>


            <label>
                <b>Email</b>
            </label>

            <input
                type="email"
                id="editEmail"
                placeholder="Enter email"
            >

            <br><br>


            <label>
                <b>Phone</b>
            </label>

            <input
                type="text"
                id="editPhone"
                placeholder="Enter phone number"
            >

            <br><br>

            <p>
                <b>Status:</b>
                <span id="editStatus"></span>
            </p>

            <small>
                Vendor account status can only be changed by Admin.
            </small>

            <br><br>

            <button onclick="saveProfile()">
                💾 Save Changes
            </button>

            <button onclick="cancelEdit()">
                ❌ Cancel
            </button>

        </div>

    </div>

</div>


<script src="js/vendor-profile.js"></script>

</body>

</html>
