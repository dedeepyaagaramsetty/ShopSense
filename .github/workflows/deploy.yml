name: ShopSense CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "06290727"
          POSTGRES_DB: shopsense_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shopsense_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:06290727@localhost:5432/shopsense_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx2 locust

      - name: Run tests
        run: |
          pytest -v

      - name: Build Docker image
        run: |
          docker build -t shopsense:latest .